[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-os-mvp"
version = "0.1.0"
description = "Synthetic Docker CPU-share feasibility experiment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]

[project.scripts]
adaptive-os = "adaptive_os.cli:main"
adaptive-os-desktop = "adaptive_os.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adaptive_os.sandbox" = ["Dockerfile", ".dockerignore"]
